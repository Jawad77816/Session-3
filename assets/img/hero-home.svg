<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a modern luxury home at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a30"/>
      <stop offset="0.45" stop-color="#3a2f47"/>
      <stop offset="0.72" stop-color="#8a5a45"/>
      <stop offset="0.9" stop-color="#c98a54"/>
      <stop offset="1" stop-color="#e6b477"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#f4d29a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f4d29a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3326"/>
      <stop offset="1" stop-color="#171d17"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b0"/>
      <stop offset="1" stop-color="#f0b27a"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e2d6"/>
      <stop offset="1" stop-color="#cfc4b2"/>
    </linearGradient>
    <linearGradient id="facade2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7b8a2"/>
      <stop offset="1" stop-color="#a8977e"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db6b6"/>
      <stop offset="1" stop-color="#5f7d80"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="620" fill="url(#sky)"/>
  <circle cx="1180" cy="150" r="150" fill="#f6d9a6" opacity="0.16"/>
  <ellipse cx="1120" cy="600" rx="900" ry="220" fill="url(#glow)"/>

  <!-- Distant tree line -->
  <path d="M0 560 q120 -40 260 -20 q140 20 320 -10 q220 -40 420 -6 q260 44 600 -14 L1600 560 L1600 640 L0 640 Z" fill="#241f2e" opacity="0.75"/>

  <!-- Lawn -->
  <rect y="600" width="1600" height="300" fill="url(#lawn)"/>
  <path d="M0 640 q400 40 800 20 q400 -20 800 12 L1600 900 L0 900 Z" fill="#1d241b"/>

  <!-- Pool with reflection -->
  <ellipse cx="470" cy="812" rx="330" ry="58" fill="url(#pool)" opacity="0.9"/>
  <ellipse cx="470" cy="812" rx="330" ry="58" fill="none" stroke="#d9c9a6" stroke-width="2" opacity="0.4"/>
  <rect x="300" y="792" width="340" height="8" fill="#ffe6b0" opacity="0.25"/>

  <!-- Main house -->
  <g>
    <!-- lower wing -->
    <rect x="820" y="452" width="360" height="180" fill="url(#facade)"/>
    <!-- main two-story volume -->
    <rect x="1020" y="360" width="330" height="272" fill="url(#facade2)"/>
    <!-- flat roof overhangs -->
    <rect x="806" y="444" width="388" height="14" fill="#3c342b"/>
    <rect x="1006" y="352" width="358" height="14" fill="#2f2820"/>

    <!-- big warm windows (lower) -->
    <rect x="852" y="486" width="86" height="120" fill="url(#win)"/>
    <rect x="956" y="486" width="86" height="120" fill="url(#win)"/>
    <rect x="1064" y="486" width="86" height="120" fill="url(#win)" opacity="0.96"/>
    <!-- upper windows -->
    <rect x="1044" y="398" width="70" height="86" fill="url(#win)"/>
    <rect x="1136" y="398" width="70" height="86" fill="url(#win)"/>
    <rect x="1228" y="398" width="70" height="86" fill="url(#win)" opacity="0.9"/>
    <!-- window mullions -->
    <g stroke="#8a7a5f" stroke-width="3" opacity="0.7">
      <line x1="895" y1="486" x2="895" y2="606"/>
      <line x1="999" y1="486" x2="999" y2="606"/>
      <line x1="1107" y1="486" x2="1107" y2="606"/>
    </g>
    <!-- entry -->
    <rect x="1174" y="536" width="46" height="96" fill="#3a2f22"/>
    <rect x="1174" y="536" width="46" height="96" fill="url(#win)" opacity="0.35"/>
    <!-- warm entry light -->
    <ellipse cx="1197" cy="560" rx="70" ry="42" fill="#ffdca0" opacity="0.18"/>
  </g>

  <!-- Foreground framing trees -->
  <path d="M120 900 C90 700 150 560 190 520 C230 560 290 700 260 900 Z" fill="#12160f"/>
  <path d="M1470 900 C1440 660 1520 520 1560 470 L1600 470 L1600 900 Z" fill="#12160f"/>
  <ellipse cx="700" cy="812" rx="70" ry="16" fill="#0f130d" opacity="0.6"/>
  <path d="M690 812 C680 720 700 660 715 640 C735 665 750 730 740 812 Z" fill="#141a12"/>
</svg>
