<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a bright modern luxury home by day">
  <defs>
    <linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc3e6"/>
      <stop offset="0.55" stop-color="#bfe0f0"/>
      <stop offset="1" stop-color="#eaf4f7"/>
    </linearGradient>
    <linearGradient id="dlawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cbd72"/>
      <stop offset="1" stop-color="#7ea158"/>
    </linearGradient>
    <linearGradient id="dfac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6f0"/><stop offset="1" stop-color="#e4dacb"/>
    </linearGradient>
    <linearGradient id="dfac2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dccd"/><stop offset="1" stop-color="#cbbca4"/>
    </linearGradient>
    <linearGradient id="dwin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dceef6"/><stop offset="1" stop-color="#a7c9d8"/>
    </linearGradient>
    <linearGradient id="dpool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc0d8"/><stop offset="1" stop-color="#4a97b3"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="620" fill="url(#dsky)"/>
  <circle cx="250" cy="150" r="70" fill="#fdf0cf" opacity="0.9"/>
  <circle cx="250" cy="150" r="120" fill="#fdf0cf" opacity="0.25"/>
  <ellipse cx="640" cy="150" rx="150" ry="46" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="740" cy="170" rx="120" ry="40" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="1180" cy="110" rx="130" ry="40" fill="#ffffff" opacity="0.6"/>

  <!-- distant treeline -->
  <path d="M0 585 q160 -34 340 -14 q200 22 460 -12 q300 -40 800 -6 L1600 585 L1600 640 L0 640 Z" fill="#8aa866" opacity="0.6"/>

  <!-- lawn -->
  <rect y="600" width="1600" height="300" fill="url(#dlawn)"/>

  <!-- home (weighted to the right so hero text sits on the left) -->
  <g>
    <rect x="900" y="440" width="360" height="196" fill="url(#dfac)"/>
    <rect x="1120" y="356" width="330" height="280" fill="url(#dfac2)"/>
    <rect x="886" y="432" width="388" height="14" fill="#3c342b"/>
    <rect x="1106" y="348" width="358" height="14" fill="#2f2820"/>
    <!-- glass -->
    <rect x="936" y="474" width="150" height="150" fill="url(#dwin)"/>
    <g stroke="#88a7b4" stroke-width="4"><line x1="986" y1="474" x2="986" y2="624"/><line x1="1036" y1="474" x2="1036" y2="624"/></g>
    <rect x="1110" y="474" width="120" height="150" fill="url(#dwin)"/>
    <rect x="1150" y="392" width="70" height="86" fill="url(#dwin)"/>
    <rect x="1250" y="392" width="70" height="86" fill="url(#dwin)"/>
    <rect x="1344" y="392" width="70" height="86" fill="url(#dwin)"/>
    <!-- door -->
    <rect x="1252" y="540" width="48" height="96" fill="#6a4f39"/>
  </g>

  <!-- palm accents -->
  <g>
    <rect x="806" y="470" width="12" height="166" fill="#6a4a2e"/>
    <path d="M812 470 q-70 -16 -110 8 q60 -6 108 6 q-56 -34 -104 -46 q68 8 106 34 q6 -58 44 -84 q-24 56 -30 88 q54 -32 104 -34 q-70 22 -104 54 Z" fill="#5f8a44"/>
  </g>

  <!-- pool + deck -->
  <rect x="120" y="720" width="720" height="120" rx="10" fill="#e5dbc6"/>
  <rect x="160" y="742" width="520" height="76" rx="8" fill="url(#dpool)"/>
  <rect x="200" y="760" width="360" height="10" fill="#eaf7fb" opacity="0.6"/>

  <!-- foreground shrubs -->
  <circle cx="1470" cy="700" r="60" fill="#5f8144"/>
  <circle cx="70" cy="770" r="60" fill="#5f8144"/>
</svg>
